<!DOCTYPE html>
<html lang="zh-MO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 澳門消費券記錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .title-wrapper {
            position: relative;
            display: inline-block;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 0.05em;
        }
        
        .title-stroke-white {
            -webkit-text-stroke: 4px white;
            color: transparent;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
            user-select: none;
        }

        .title-stroke-yellow {
            -webkit-text-stroke: 4px #fff59d;
            color: transparent;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
            user-select: none;
        }

        .title-fill-red-orange {
            background: linear-gradient(to bottom, #e95a74, #f39c4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 2;
        }

        .title-fill-blue-purple {
            background: linear-gradient(to bottom, #283593, #7b1fa2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 2;
        }

        /* Hide scrollbar for a cleaner look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#F5F0FA] h-screen w-screen flex flex-col font-sans overflow-hidden text-slate-800">

    <header class="flex-none bg-white px-4 py-3 shadow-sm z-10 flex flex-wrap items-center justify-between gap-3 relative">
        <div class="flex items-center gap-1 text-2xl sm:text-3xl whitespace-nowrap">
            <div class="title-wrapper">
                <span class="title-stroke-white">2026</span>
                <span class="title-fill-red-orange">2026</span>
            </div>
            <div class="title-wrapper">
                <span class="title-stroke-yellow">社區消費</span>
                <span class="title-fill-blue-purple">社區消費</span>
            </div>
            <div class="title-wrapper hidden sm:inline-block">
                <span class="title-stroke-white">連環賞</span>
                <span class="title-fill-red-orange">連環賞</span>
            </div>
        </div>
        
        <select id="week-selector" class="bg-purple-50 border border-purple-200 text-purple-900 py-1.5 px-3 rounded-lg text-sm font-bold focus:outline-none focus:ring-2 focus:ring-purple-400 cursor-pointer shadow-sm">
            <!-- Options populated by JS -->
        </select>
    </header>

    <main class="flex-1 overflow-y-auto no-scrollbar w-full">
        <div class="max-w-3xl mx-auto p-3 sm:p-4 pb-24">
            <!-- 1 Column Layout enforced here: grid-cols-1 -->
            <div id="app-grid" class="grid grid-cols-1 gap-4">
                <!-- Platform Cards populated by JS -->
            </div>
        </div>
    </main>

    <footer class="absolute bottom-0 w-full flex-none bg-white/95 backdrop-blur-md border-t border-purple-200 px-4 py-3 sm:py-4 flex flex-col sm:flex-row justify-between items-center z-20 shadow-[0_-4px_15px_-3px_rgba(0,0,0,0.1)]">
        <div class="flex items-center justify-center sm:justify-start gap-4 sm:gap-6 text-sm w-full">
            <div class="flex flex-col items-center sm:items-start">
                <span class="text-gray-500 font-medium text-xs">本週總計</span>
                <span id="footer-week-total" class="font-black text-purple-900 text-xl leading-none mt-1">$0</span>
            </div>
            <div class="w-px h-8 bg-gray-200"></div>
            <div class="flex flex-col items-center sm:items-start">
                <span class="text-gray-500 font-medium text-xs">全期總計</span>
                <span id="footer-overall-total" class="font-black text-blue-900 text-xl leading-none mt-1">$0</span>
            </div>
            <div class="w-px h-8 bg-gray-200"></div>
            <div class="flex flex-col items-center sm:items-start">
                <span class="text-gray-500 font-medium text-xs">已核銷 (全期)</span>
                <span id="footer-used" class="font-bold text-gray-400 text-xl leading-none mt-1 line-through decoration-gray-400">$0</span>
            </div>
        </div>
    </footer>

    <div id="add-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-200 overflow-hidden" id="modal-content">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-base font-bold text-gray-800 flex items-center gap-2" id="modal-title">新增優惠券</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-700 p-1 bg-white rounded-full shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="p-5 bg-white">
                <p class="text-sm font-medium text-gray-600 mb-3 text-center">請選擇抽中的券種</p>
                <div id="voucher-options" class="flex flex-wrap gap-2.5 justify-center">
                    <!-- Options populated by JS -->
                </div>
            </div>

            <div class="p-4 border-t border-gray-100 flex gap-3 bg-gray-50">
                <button id="cancel-btn" class="flex-1 py-2.5 rounded-xl text-sm bg-white border border-gray-200 text-gray-700 font-bold hover:bg-gray-100 transition-colors shadow-sm">取消</button>
                <button id="confirm-btn" class="flex-1 py-2.5 rounded-xl text-sm bg-purple-600 text-white font-bold hover:bg-purple-700 transition-colors shadow-sm">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        // --- Data Definitions ---
        const WEEKS = Array.from({length: 10}, (_, i) => ({
            id: `w${i+1}`, 
            label: `第${i+1}週`
        }));
        
        WEEKS[0].label = '第1週 (10/09 - 10/15)';
        WEEKS[1].label = '第2週 (10/16 - 10/22)';
        WEEKS[2].label = '第3週 (10/23 - 10/29)';
        WEEKS[3].label = '第4週 (10/30 - 11/05)';
        WEEKS[4].label = '第5週 (11/06 - 11/12)';
        WEEKS[5].label = '第6週 (11/13 - 11/19)';
        WEEKS[6].label = '第7週 (11/20 - 11/26)';
        WEEKS[7].label = '第8週 (11/27 - 12/03)';
        WEEKS[8].label = '第9週 (12/04 - 12/10)';
        WEEKS[9].label = '第10週 (12/11 - 12/17)';

        const PLATFORMS = [
            { id: 'taifung', name: '大豐銀行', logo: 'TaiFung.webp', color: 'bg-yellow-50 text-yellow-700 border-yellow-200' },
            { id: 'cgb', name: '廣發銀行', logo: '廣發.webp', color: 'bg-red-50 text-red-700 border-red-200' },
            { id: 'mpay', name: 'MPay', logo: 'MPay.webp', color: 'bg-orange-50 text-orange-700 border-orange-200' },
            { id: 'boc', name: '中國銀行', logo: 'BOC.webp', color: 'bg-red-50 text-red-800 border-red-200' },
            { id: 'icbc', name: '工商銀行', logo: 'ICBC.webp', color: 'bg-red-50 text-red-600 border-red-200' },
            { id: 'luso', name: '國際銀行', logo: '國際.webp', color: 'bg-blue-50 text-blue-700 border-blue-200' },
            { id: 'alipay', name: '支付寶', logo: '支付寶.webp', color: 'bg-blue-50 text-blue-500 border-blue-200' },
            { id: 'uepay', name: 'UePay', logo: 'Uepay.webp', color: 'bg-green-50 text-green-700 border-green-200' },
        ];

        const VOUCHER_OPTIONS = [
            { id: 'v10', type: '電子優惠券', value: 10, label: '$10' },
            { id: 'v20', type: '電子優惠券', value: 20, label: '$20' },
            { id: 'v50', type: '電子優惠券', value: 50, label: '$50' },
            { id: 'v100', type: '電子優惠券', value: 100, label: '$100' },
            { id: 'v200', type: '電子優惠券', value: 200, label: '$200' },
            { id: 'm_discount', type: '商戶滿減券', value: 0, label: '商戶滿減券' },
            { id: 'm_promo', type: '商戶優惠券', value: 0, label: '商戶優惠券' },
        ];

        // --- Application State ---
        let state = {
            selectedWeek: 'w1',
            vouchers: [], 
            drawTimes: {}, 
            drawDays: {}, // Added drawDays state
            modalOpen: false,
            modalPlatformId: null,
            selectedVoucherOpt: null
        };

        const LOCAL_STORAGE_KEY = 'voucherTracker2026State';

        // --- DOM Elements ---
        const weekSelector = document.getElementById('week-selector');
        const appGrid = document.getElementById('app-grid');
        const footerWeekTotal = document.getElementById('footer-week-total');
        const footerOverallTotal = document.getElementById('footer-overall-total');
        const footerUsed = document.getElementById('footer-used');
        const modal = document.getElementById('add-modal');
        const modalTitle = document.getElementById('modal-title');
        const voucherOptionsContainer = document.getElementById('voucher-options');
        const modalContent = document.getElementById('modal-content');

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function saveState() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
                    selectedWeek: state.selectedWeek,
                    vouchers: state.vouchers,
                    drawTimes: state.drawTimes,
                    drawDays: state.drawDays
                }));
            } catch (e) {
                console.error("Could not save to LocalStorage", e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.selectedWeek) state.selectedWeek = parsed.selectedWeek;
                    if (parsed.vouchers) state.vouchers = parsed.vouchers;
                    if (parsed.drawTimes) state.drawTimes = parsed.drawTimes;
                    if (parsed.drawDays) state.drawDays = parsed.drawDays;
                }
            } catch (e) {
                console.error("Could not load from LocalStorage", e);
            }
        }

        function getVoucherColorClass(v) {
            // Apply gray color if the voucher is marked as used
            if (v.isUsed) return 'bg-gray-200 text-gray-400 opacity-70 border-gray-300 border-dashed';
            
            // Map types and values to specific colors
            if (v.type === '商戶滿減券') return 'bg-orange-100 text-orange-900 border-orange-300';
            if (v.type === '商戶優惠券') return 'bg-yellow-100 text-yellow-900 border-yellow-400';
            
            switch (v.value) {
                case 10: return 'bg-red-100 text-red-900 border-red-200';
                case 20: return 'bg-purple-200 text-purple-900 border-purple-300';
                case 50: return 'bg-[#d7ccc8] text-[#4e342e] border-[#bcaaa4]'; // Brown
                case 100: return 'bg-blue-200 text-blue-900 border-blue-300';
                case 200: return 'bg-green-200 text-green-900 border-green-300';
                default: return 'bg-white text-gray-800 border-gray-200';
            }
        }

        function init() {
            loadState();

            // Populate the week dropdown
            weekSelector.innerHTML = WEEKS.map(w => `<option value="${w.id}">${w.label}</option>`).join('');
            
            // Set the saved week as selected
            weekSelector.value = state.selectedWeek;

            weekSelector.addEventListener('change', (e) => {
                state.selectedWeek = e.target.value;
                saveState(); // Save the new week selection immediately
                render();
            });

            // Set up event listeners for the modal
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('cancel-btn').addEventListener('click', closeModal);
            document.getElementById('confirm-btn').addEventListener('click', confirmAddVoucher);
            
            // Close modal when clicking outside
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            render();
        }

        function render() {
            const currentWeekVouchers = state.vouchers.filter(v => v.weekId === state.selectedWeek);
            
            // --- Calculation of Totals ---
            let weekTotal = 0;
            currentWeekVouchers.forEach(v => { weekTotal += v.value; });

            let overallTotal = 0;
            let usedTotal = 0;
            state.vouchers.forEach(v => {
                overallTotal += v.value;
                if (v.isUsed) usedTotal += v.value;
            });
            
            // Update Footer Display
            footerWeekTotal.innerText = `$${weekTotal}`;
            footerOverallTotal.innerText = `$${overallTotal}`;
            footerUsed.innerText = `$${usedTotal}`;

            // --- Generate Grid Layout (Strictly 1 Column as requested) ---
            appGrid.innerHTML = PLATFORMS.map(platform => {
                const platformVouchers = currentWeekVouchers
                    .filter(v => v.platformId === platform.id)
                    .sort((a, b) => a.createdAt - b.createdAt);
                
                const timeKey = `${state.selectedWeek}_${platform.id}`;
                const drawTime = state.drawTimes[timeKey] || '';
                const drawDay = state.drawDays[timeKey] || '';

                // Build HTML for the 3 slots
                let slotsHtml = '';
                for (let i = 0; i < 3; i++) {
                    const voucher = platformVouchers[i];
                    if (voucher) {
                        const colorClass = getVoucherColorClass(voucher);
                        const isMerchant = voucher.type === '商戶滿減券' || voucher.type === '商戶優惠券';
                        
                        slotsHtml += `
                            <div onclick="toggleUsed('${voucher.id}')" 
                                 class="relative rounded-xl border-2 flex flex-col items-center justify-center cursor-pointer transition-all min-h-[90px] p-2 shadow-sm hover:shadow-md transform hover:-translate-y-0.5 ${colorClass}"
                                 title="點擊切換核銷狀態">
                                
                                <!-- Delete Button -->
                                <button onclick="deleteVoucher('${voucher.id}', event)" class="absolute top-1.5 right-1.5 p-1 text-black/20 hover:text-red-500 hover:bg-red-50 rounded-full z-10 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                </button>

                                <!-- Status Badge -->
                                ${voucher.isUsed ? `<div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>` : ''}
                                
                                ${isMerchant ? `
                                    <span class="text-sm sm:text-base font-black leading-tight text-center px-2 z-10">
                                        ${voucher.type}
                                    </span>
                                ` : `
                                    <span class="text-2xl sm:text-3xl font-black leading-none tracking-tight z-10">
                                        $${voucher.value}
                                    </span>
                                    <span class="text-[11px] sm:text-xs font-bold leading-none mt-1.5 truncate w-full text-center px-1 opacity-70 z-10">
                                        電子優惠
                                    </span>
                                `}
                            </div>
                        `;
                    } else {
                        // Empty slot button
                        slotsHtml += `
                            <button onclick="openModal('${platform.id}')" 
                                class="rounded-xl border-2 border-dashed border-purple-200 bg-white/50 flex flex-col items-center justify-center text-purple-400 hover:bg-purple-50 hover:border-purple-400 hover:text-purple-600 transition-all min-h-[90px] shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                <span class="text-xs font-semibold">新增</span>
                            </button>
                        `;
                    }
                }

                // Render One Row (Card) for this platform
                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-purple-100 flex flex-col hover:shadow-md transition-shadow">
                        <!-- Platform Header -->
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-2.5 text-sm sm:text-base font-bold px-3 py-1.5 rounded-full border ${platform.color} shadow-sm">
                                <img src="${platform.logo}" alt="${platform.name}" class="w-6 h-6 sm:w-7 sm:h-7 rounded-full object-cover shadow bg-white border border-black/5" onerror="this.src='https://placehold.co/40x40/f3f4f6/a1a1aa?text=${platform.name.charAt(0)}'">
                                ${platform.name}
                            </div>
                            
                            <!-- Draw Time & Day Input -->
                            <div class="flex items-center gap-2">
                                <select onchange="updateDay('${platform.id}', this.value)" class="text-sm font-semibold bg-gray-50 border border-gray-200 text-gray-700 rounded-lg px-2 py-1.5 shadow-sm focus:outline-none focus:border-purple-400 cursor-pointer">
                                    <option value="" ${drawDay === '' ? 'selected' : ''}>星期</option>
                                    <option value="五" ${drawDay === '五' ? 'selected' : ''}>五</option>
                                    <option value="六" ${drawDay === '六' ? 'selected' : ''}>六</option>
                                    <option value="日" ${drawDay === '日' ? 'selected' : ''}>日</option>
                                </select>
                                <div class="flex items-center bg-gray-50 px-2.5 py-1.5 rounded-lg border border-gray-200 shadow-sm" title="選擇抽獎時間">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="text-gray-400 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    <input type="time" 
                                           value="${drawTime}"
                                           onchange="updateTime('${platform.id}', this.value)"
                                           class="text-sm font-semibold bg-transparent border-none focus:outline-none focus:ring-0 text-gray-700 p-0 m-0 cursor-pointer">
                                </div>
                            </div>
                        </div>

                        <!-- 3 Voucher Slots container -->
                        <div class="grid grid-cols-3 gap-3">
                            ${slotsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openModal = function(platformId) {
            const platform = PLATFORMS.find(p => p.id === platformId);
            state.modalPlatformId = platformId;
            state.selectedVoucherOpt = VOUCHER_OPTIONS[0]; // Default selection
            
            modalTitle.innerHTML = `
                <img src="${platform.logo}" class="w-6 h-6 rounded-full border" onerror="this.style.display='none'"> 
                新增至 ${platform.name}
            `;
            
            renderModalOptions();
            
            modal.classList.remove('hidden');
            // Slight delay for transition effect
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        window.closeModal = function() {
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                state.modalPlatformId = null;
            }, 200);
        }

        function renderModalOptions() {
            voucherOptionsContainer.innerHTML = VOUCHER_OPTIONS.map(opt => {
                const isSelected = state.selectedVoucherOpt && state.selectedVoucherOpt.id === opt.id;
                const isMerchant = opt.type !== '電子優惠券';
                
                const baseClass = isSelected 
                    ? 'bg-purple-600 text-white border-purple-600 shadow-md ring-2 ring-purple-200 ring-offset-1 transform scale-105' 
                    : 'bg-white text-gray-700 border-gray-200 hover:bg-purple-50 hover:border-purple-200';
                
                const widthClass = isMerchant ? 'w-full text-base py-3' : 'w-[30%] text-base py-3';
                
                return `
                    <button onclick="selectVoucherOption('${opt.id}')" 
                        class="rounded-xl font-bold text-center border-2 transition-all ${baseClass} ${widthClass}">
                        ${opt.label}
                    </button>
                `;
            }).join('');
        }

        window.selectVoucherOption = function(optId) {
            state.selectedVoucherOpt = VOUCHER_OPTIONS.find(o => o.id === optId);
            renderModalOptions();
        }

        window.confirmAddVoucher = function() {
            if (!state.modalPlatformId || !state.selectedVoucherOpt) return;
            
            state.vouchers.push({
                id: generateId(),
                weekId: state.selectedWeek,
                platformId: state.modalPlatformId,
                type: state.selectedVoucherOpt.type,
                value: state.selectedVoucherOpt.value,
                isUsed: false,
                createdAt: Date.now()
            });
            
            saveState();
            closeModal();
            render();
        }

        window.toggleUsed = function(voucherId) {
            const voucher = state.vouchers.find(v => v.id === voucherId);
            if (voucher) {
                voucher.isUsed = !voucher.isUsed;
                saveState();
                render();
            }
        }

        window.deleteVoucher = function(voucherId, event) {
            event.stopPropagation(); // Prevent triggering the toggleUsed event
            state.vouchers = state.vouchers.filter(v => v.id !== voucherId);
            saveState();
            render();
        }

        window.updateTime = function(platformId, timeValue) {
            const timeKey = `${state.selectedWeek}_${platformId}`;
            state.drawTimes[timeKey] = timeValue;
            saveState();
        }

        window.updateDay = function(platformId, dayValue) {
            const timeKey = `${state.selectedWeek}_${platformId}`;
            state.drawDays[timeKey] = dayValue;
            saveState();
        }

        // Boot up the application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
